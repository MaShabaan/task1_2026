<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | My Website</title>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo">My Website</h1>
      </div>
    </header>

    <main class="container">
      <section class="contact-section">
        <h2>Contact Us</h2>
        <p>
          Fill in the form below and we'll get back to you as soon as possible.
        </p>

        <form action="#" method="post" class="contact-form">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="number"
              id="phone"
              name="phone"
              placeholder="e.g. 01012345678"
              min="0"
              required
            />
          </div>

          <div class="form-group">
            <label for="dob">Preferred Contact Date</label>
            <input type="date" id="dob" name="dob" required />
          </div>

          <div class="form-group">
            <p>Preferred Contact Method</p>
            <label>
              <input type="radio" name="contact-method" value="email" checked />
              Email
            </label>
            <label>
              <input type="radio" name="contact-method" value="phone" />
              Phone
            </label>
            <label>
              <input type="radio" name="contact-method" value="whatsapp" />
              WhatsApp
            </label>
          </div>

          <div class="form-group">
            <p>Topics You’re Interested In</p>
            <label>
              <input type="checkbox" name="topics" value="web-design" />
              Web Design
            </label>
            <label>
              <input type="checkbox" name="topics" value="development" />
              Development
            </label>
            <label>
              <input type="checkbox" name="topics" value="marketing" />
              Marketing
            </label>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <select id="subject" name="subject" required>
              <option value="">-- Please choose an option --</option>
              <option value="general">General Inquiry</option>
              <option value="support">Technical Support</option>
              <option value="feedback">Feedback</option>
              <option value="business">Business Partnership</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea
              id="message"
              name="message"
              rows="6"
              placeholder="Write your message here..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn">Send Message</button>
        </form>
      </section>
    </main>
  </body>
</html>
